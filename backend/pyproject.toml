[project]
name = "hearthstone-assistant-backend"
version = "0.1.0"
description = "Hearthstone Assistant API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.41",
    "alembic==1.16.4",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "psycopg[binary]>=3.3.4",
    "deepagents>=0.7.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.3",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
