schema: spec-driven

context: |
  Product: 炉石传说卡牌助手（PC Web，简中）
  Stack: React frontend + FastAPI backend (uv for Python deps); PostgreSQL (SQLite OK for local)
  Auth: username/password + JWT
  Card data: Blizzard official Hearthstone API only (zh_CN); sync to local DB
  Formats: Standard and Wild
  Decks: per-user in DB; draft save allowed; finalize requires validation
  Deck builder page: immersive 3-column (pool | editor | agent), no global left nav
  Agent: one conversation thread per deck; free-form assistant; optional structured deck_patch
  LLM: single server-side API key; OpenAI and Claude-compatible providers
  Non-goals for MVP: collection/dust, match tracker, community sharing, per-user LLM keys, mobile

rules:
  proposal:
    - Keep proposals under 500 words when practical
    - Always include Non-goals in Impact or What Changes
  tasks:
    - Break tasks into small verifiable checkbox items
    - Order by dependency

operations:
  apply:
    guidance:
      - Prefer implementing backend contracts before polishing UI
      - Keep test summaries concise
  archive:
    guidance:
      - Summarize the archive outcome before finishing
